# --- Interface utilisateur ---
ui.base.url=https://formy-project.herokuapp.com
iframe.base.url=https://the-internet.herokuapp.com

# --- Navigateur (surchargeables avec -Dbrowser=... -Dheadless=...) ---
browser=chrome
headless=true
window.size=1920,1080
# URL d un Selenium Grid / selenium/standalone-chrome (vide = navigateur local via Selenium Manager)
remote.url=

# --- Delais (secondes) ---
timeout.explicit=15
timeout.page.load=30

# --- API Reqres ---
api.base.url=https://reqres.in
# Cle gratuite publique de Reqres. Surchargeable par la variable d'environnement REQRES_API_KEY.
api.key=reqres-free-v1
# Temps de reponse maximal tolere (ms)
api.max.response.time=3000
# Reqres limite le debit (HTTP 429) : nombre maximal de tentatives et attente maximale (s)
api.rate.limit.max.retries=3
api.rate.limit.max.wait=65
